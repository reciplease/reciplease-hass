[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reciplease-hass"
version = "0.1.0"
description = "Async client library for the Reciplease API, used by the Home Assistant custom integration"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-homeassistant-custom-component"]

[project.urls]
Repository = "https://github.com/reciplease/reciplease-hass"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
